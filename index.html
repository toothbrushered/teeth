<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dental Screening</title>
<style>
:root{--bg:#fff;--text:#1d1d1f;--text2:#86868b;--fill:#f5f5f7;--blue:#0071e3;--glass:rgba(255,255,255,.72);--line:rgba(0,0,0,.08);--green:#34c759;
--font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--text:#f5f5f7;--text2:#86868b;--fill:#1c1c1e;--blue:#0a84ff;--glass:rgba(40,40,42,.7);--line:rgba(255,255,255,.12);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--text:#f5f5f7;--text2:#86868b;--fill:#1c1c1e;--blue:#0a84ff;--glass:rgba(40,40,42,.7);--line:rgba(255,255,255,.12);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.47 var(--font);-webkit-font-smoothing:antialiased;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:14px}
.view{display:none;min-height:100vh;padding:72px 24px 64px;flex-direction:column;align-items:center}
.view.on{display:flex}
#home{position:relative;isolation:isolate;overflow:hidden;justify-content:center;text-align:center;min-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
h1{font-size:clamp(44px,9vw,96px);line-height:1;letter-spacing:-.04em;font-weight:700;margin:0}
.row2{display:flex;gap:12px;margin-top:44px;flex-wrap:wrap;justify-content:center}
.btn{background:var(--blue);color:#fff;font-size:19px;font-weight:500;padding:14px 32px;border-radius:99px;transition:transform .2s,opacity .2s,background .2s;display:inline-flex;flex-direction:column;align-items:center;line-height:1.2}
.btn small{font-size:13px;font-weight:400;opacity:.75;margin-top:2px}
.btn.g{background:var(--fill);color:var(--blue)}
.btn:hover:not(:disabled){transform:scale(1.03)}.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.3;cursor:not-allowed}
.aur{position:absolute;inset:-10%;z-index:-1;background:radial-gradient(38% 34% at 18% 22%,rgba(10,132,255,.24),transparent 70%),radial-gradient(34% 34% at 82% 18%,rgba(125,122,255,.2),transparent 70%),radial-gradient(44% 38% at 62% 88%,rgba(52,199,220,.24),transparent 70%);animation:dr 18s ease-in-out infinite alternate}
@keyframes dr{to{transform:translate(2%,-3%) scale(1.06)}}
#home h1{background:linear-gradient(180deg,var(--text) 35%,color-mix(in srgb,var(--text) 50%,transparent));-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:.08em}
.hero{position:relative;width:clamp(190px,32vw,280px);margin:0 auto 44px}
.hero::after{content:"";position:absolute;left:20%;right:20%;bottom:-26px;height:20px;border-radius:50%;background:rgba(0,40,100,.2);filter:blur(12px)}
.hero::before{content:"";position:absolute;inset:-40%;background:radial-gradient(closest-side,color-mix(in srgb,var(--blue) 28%,transparent),transparent);filter:blur(10px);z-index:-1}
.hero svg{width:100%;height:auto;display:block;animation:fl 6s ease-in-out infinite;filter:drop-shadow(0 22px 28px rgba(0,60,140,.22))}
@keyframes fl{50%{transform:translateY(-8px)}}
.pb{display:inline-flex;align-items:center;justify-content:center;min-width:150px;padding:14px 30px;border-radius:99px;font-size:19px;font-weight:500;letter-spacing:-.01em;transition:transform .2s,background .2s}
.pb.p{color:#fff;background:var(--blue)}
.pb.s{color:var(--blue);background:var(--fill)}
.pb:hover{transform:scale(1.03)}.pb:active{transform:scale(.97)}
@media (max-width:720px){.row2{flex-direction:column;width:100%;max-width:300px}.pb{width:100%}}
.top{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:9;display:none;justify-content:space-between;align-items:center;padding:14px 20px}
.top.on{display:flex}
.circ{width:44px;height:44px;border-radius:50%;background:var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);display:grid;place-items:center;box-shadow:0 0 0 .5px var(--line),0 4px 16px rgba(0,0,0,.06)}
.circ svg{width:11px;height:19px;color:var(--blue)}
.mode{font-size:14px;color:var(--text2);padding:9px 16px;border-radius:99px;background:var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:0 0 0 .5px var(--line)}
#scr h1{font-size:clamp(36px,6vw,56px);margin:24px 0 48px;text-align:center}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,240px));gap:16px;justify-content:center;width:100%}
.slot{aspect-ratio:3/4;border-radius:32px;background:var(--fill);position:relative;overflow:hidden;display:grid;place-items:center;transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.slot:hover{transform:scale(1.02)}
.slot input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;z-index:2}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot .pl{text-align:center;color:var(--text2);font-size:17px;font-weight:500}
.slot .pl svg{width:30px;height:30px;display:block;margin:0 auto 10px;color:var(--blue)}
.slot .nm{position:absolute;left:14px;bottom:14px;z-index:1;font-size:14px;font-weight:500;padding:6px 14px;border-radius:99px;background:var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);display:none}
.slot.ok .nm{display:block}.slot.ok .pl{display:none}
.slot.over{outline:3px solid var(--blue)}
.cta{margin-top:48px;text-align:center}
.status{margin-top:40px;color:var(--text2);font-size:17px;min-height:26px;display:none;align-items:center;gap:10px}
.status.on{display:flex}
.sp{width:16px;height:16px;border-radius:50%;border:2px solid var(--fill);border-top-color:var(--blue);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.letter{display:none;width:100%;max-width:640px;margin-top:72px;text-align:left;animation:rise .5s cubic-bezier(.2,.8,.2,1)}
.letter.on{display:block}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
.letter h2{font-size:clamp(26px,4vw,34px);line-height:1.2;letter-spacing:-.02em;font-weight:600;margin:0 0 40px}
.r{display:flex;justify-content:space-between;align-items:center;padding:18px 0;border-top:.5px solid var(--line);font-size:19px}
.r:last-of-type{border-bottom:.5px solid var(--line)}
.r span{color:var(--text2);font-size:17px}
.r span.f{color:#ff9f0a}
.fine{color:var(--text2);font-size:13px;margin-top:20px}
.acts{display:flex;gap:20px;margin-top:28px}
.acts button{color:var(--blue);font-size:17px}
@media (max-width:640px){.slots{grid-template-columns:1fr;max-width:260px}.slot{aspect-ratio:4/3}}
@media print{.top,body::before,.acts{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="top" id="top">
  <button class="circ" id="back" aria-label="Back"><svg viewBox="0 0 11 19" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 1.5 2 9.5l7.5 8"/></svg></button>
  <span class="mode" id="mode"></span>
</div>

<main>
<section class="view on" id="home">
  <div class="aur" aria-hidden="true"></div>
  <div class="hero" aria-hidden="true"><svg viewBox="0 0 200 220" fill="none"><defs><linearGradient id="tg" x1="0" y1="0" x2="0.6" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".65" stop-color="#e6edf7"/><stop offset="1" stop-color="#c3d0e3"/></linearGradient><linearGradient id="hl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><path d="M100 24C72 10 30 20 32 72c1 30 18 48 22 78 4 34 8 56 24 56 15 0 15-44 22-44s7 44 22 44c16 0 20-22 24-56 4-30 21-48 22-78 2-52-40-62-68-48Z" fill="url(#tg)" stroke="rgba(20,60,120,.14)" stroke-width="1.5"/><path d="M52 52c2-16 14-24 28-22" stroke="url(#hl)" stroke-width="9" stroke-linecap="round"/><path d="M62 82c0 20 10 34 12 54" stroke="rgba(255,255,255,.7)" stroke-width="5" stroke-linecap="round"/></svg></div>
  <h1>Dental<br>screening.</h1>
  <div class="row2">
    <button class="pb p" data-m="offline">Offline</button>
    <button class="pb s" data-m="online">Online</button>
  </div>
</section>

<section class="view" id="scr">
  <h1>Three photos.</h1>
  <div class="slots" id="slots"></div>
  <div class="cta"><button class="btn" id="gen" disabled>Generate referral letter</button></div>
  <div class="status" id="status" aria-live="polite"><span class="sp"></span><span id="st"></span></div>
  <article class="letter" id="letter"></article>
</section>
</main>

<script>
(function(){
  var $=function(s){return document.querySelector(s)};
  var N=["Bite","Gums","Teeth"],files={},mode="offline";
  var slots=$("#slots");
  N.forEach(function(n){
    var d=document.createElement("div");d.className="slot";
    d.innerHTML='<input type="file" accept="image/*" aria-label="Add '+n.toLowerCase()+' photo"><div class="pl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>'+n+'</div><span class="nm">'+n+'</span>';
    slots.appendChild(d);
    var inp=d.querySelector("input");
    inp.addEventListener("change",function(){take(n,d,inp.files[0])});
    ["dragenter","dragover"].forEach(function(e){d.addEventListener(e,function(v){v.preventDefault();d.classList.add("over")})});
    ["dragleave","drop"].forEach(function(e){d.addEventListener(e,function(v){v.preventDefault();d.classList.remove("over")})});
    d.addEventListener("drop",function(v){take(n,d,v.dataTransfer.files[0])});
  });
  function take(n,d,f){
    if(!f||!/^image\//.test(f.type))return;
    var r=new FileReader();
    r.onload=function(){
      files[n]=f;var o=d.querySelector("img");if(o)o.remove();
      var im=new Image();im.src=r.result;im.alt=n;d.insertBefore(im,d.firstChild);d.classList.add("ok");
      $("#gen").disabled=Object.keys(files).length<3;
    };
    r.readAsDataURL(f);
  }
  function route(){
    var s=location.hash==="#screening";
    $("#home").classList.toggle("on",!s);$("#scr").classList.toggle("on",s);$("#top").classList.toggle("on",s);
    $("#mode").textContent=mode==="offline"?"Offline":"Online";window.scrollTo(0,0);
  }
  document.querySelectorAll("[data-m]").forEach(function(b){b.addEventListener("click",function(){mode=b.dataset.m;try{sessionStorage.setItem("mode",mode)}catch(e){}location.hash="screening"})});
  $("#back").addEventListener("click",function(){history.replaceState(null,"",location.pathname+location.search);route()});
  window.addEventListener("hashchange",route);route();

  /* Backend hook: replace with a fetch to your pipeline (YOLOv8n x3 -> criteria -> RAG -> phi-3). */
  function analyse(){return new Promise(function(r){setTimeout(function(){r({
    summary:"Misaligned teeth, mild gum inflammation and caries in a permanent tooth. Dental review first, then orthodontic assessment.",
    rows:[["Malocclusion","Refer",1],["Gingivitis","MGI 2",1],["Caries","Refer",1]],
    note:"Sample output. AI-assisted. A dentist must review before use."
  })},600)})}

  var steps={offline:["Detecting","Applying criteria","Retrieving guidance","Writing with Phi-3"],online:["Detecting","Applying criteria","Searching the web","Writing"]};
  $("#gen").addEventListener("click",async function(){
    var b=this,L=$("#letter"),S=$("#status");b.disabled=true;L.classList.remove("on");S.classList.add("on");
    var p=analyse(),list=steps[mode];
    for(var i=0;i<list.length;i++){$("#st").textContent=list[i]+"…";await new Promise(function(r){setTimeout(r,700)})}
    var o=await p;S.classList.remove("on");b.disabled=false;
    L.innerHTML='<h2>'+o.summary+'</h2>'+o.rows.map(function(r){return '<div class="r">'+r[0]+'<span class="'+(r[2]?'f':'')+'">'+r[1]+'</span></div>'}).join("")+'<p class="fine">'+o.note+'</p><div class="acts"><button id="cp">Copy</button><button id="pr">Print</button></div>';
    L.classList.add("on");L.scrollIntoView({behavior:"smooth",block:"start"});
    $("#pr").onclick=function(){window.print()};
    $("#cp").onclick=function(){try{navigator.clipboard.writeText(L.innerText);$("#cp").textContent="Copied"}catch(e){}};
  });
})();
</script>
</body>
</html>
